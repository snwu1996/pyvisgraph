name: CI

on:
  push:
    branches: [master, "swu/**"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build package
        run: poetry build

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Install dependencies
        run: poetry install

      # tests/test_deploy.py is excluded: it needs GSHHS shapefiles that are
      # not in the repository.
      - name: Run tests
        run: poetry run pytest tests/test_pvg.py tests/test_boundary_scenarios.py -v
