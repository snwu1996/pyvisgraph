[tool.poetry]
name = "pyvisgraph"
version = "0.2.1"
description = "Given a set of simple obstacle polygons, build a visibility graph and find the shortest path between two points."
authors = ["Christian Reksten-Monsen <christian@reksten-monsen.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/TaipanRex/pyvisgraph"
repository = "https://github.com/TaipanRex/pyvisgraph"
keywords = ["visibility", "graph", "shortest"]
packages = [{ include = "pyvisgraph" }]
include = [
    { path = "examples", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
]

[tool.poetry.dependencies]
python = "^3.9"
tqdm = ">=4.23.4"
geopandas = { version = ">=0.14", optional = true }
PyQt6 = { version = ">=6.4", optional = true }

[tool.poetry.extras]
viewer = ["geopandas", "PyQt6"]

[tool.poetry.scripts]
pyvisgraph-viewer = "pyvisgraph.viewer.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pyshp = "^2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
