[tool.poetry]
name = "pyvisgraph"
version = "0.2.1"
description = "Given a set of simple obstacle polygons, build a visibility graph and find the shortest path between two points."
authors = ["Christian Reksten-Monsen <christian@reksten-monsen.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/TaipanRex/pyvisgraph"
repository = "https://github.com/TaipanRex/pyvisgraph"
keywords = ["visibility", "graph", "shortest"]
packages = [{ include = "pyvisgraph" }]
include = [
    { path = "examples", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    # C backend: build.py compiles these into pyvisgraph/libcvisgraph.so at
    # build time, so the sdist must carry the pinned submodule's sources.
    { path = "build.py", format = "sdist" },
    { path = "extern/cvisgraph/src/*.c", format = "sdist" },
    { path = "extern/cvisgraph/src/*.h", format = "sdist" },
    { path = "extern/cvisgraph/include/*.h", format = "sdist" },
    { path = "extern/cvisgraph/LICENSE.txt", format = "sdist" },
]

[tool.poetry.build]
# Compile the cvisgraph C backend on build/install; emits a platform wheel.
script = "build.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = "^3.10"
tqdm = ">=4.23.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pyshp = "^2.3"

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"
